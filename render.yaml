services:
  - type: web
    name: javi
    env: elixir
    plan: free
    region: oregon
    branch: main
    buildCommand: ./build.sh
    startCommand: mix ecto.migrate && mix phx.server
    envVars:
      - key: MIX_ENV
        value: prod
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: javi-db
          property: connectionString

databases:
  - name: javi-db
    plan: free
