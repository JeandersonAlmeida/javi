name: Continuous Integration
description: Run code format checks, static analysis, and tests with coverage reporting.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Code Format & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.0"
          otp-version: "26.0.2"

      - name: Install dependencies
        run: mix deps.get

      - name: Check code format
        run: mix format --check-formatted

      - name: Run Credo (static analysis)
        run: mix credo

  test:
    name: Tests with Coveralls
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: javi_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      DATABASE_URL: ecto://postgres:postgres@localhost/javi_test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Elixir, Erlang, Node.js
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.0"
          otp-version: "26.0.2"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.14.0"

      - name: Install dependencies
        run: |
          mix deps.get
          mix deps.compile

      - name: Install JS dependencies
        run: |
          cd assets
          npm ci
          cd ..

      - name: Setup database
        run: mix ecto.create && mix ecto.migrate

      - name: Run tests with coverage
        run: mix coveralls.json
